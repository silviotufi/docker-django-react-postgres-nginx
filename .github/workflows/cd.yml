
name: CD

on:
  workflow_run:
    workflows:
      - Docker Registry
    types:
      - completed

jobs:

  deploy:
    name: Deploy to Production

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, cd]

    steps:

      # ==========================================
      # CHECK DOCKER
      # ==========================================

      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # ==========================================
      # GET VERSION
      # ==========================================

      - name: Set image version
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

          echo "Deploying version:"
          echo "${{ github.event.workflow_run.head_sha }}"


      # ==========================================
      # DEPLOY PRODUCTION
      # ==========================================

      - name: Deploy production
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            pull

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d


      # ==========================================
      # CHECK SERVICES
      # ==========================================

      - name: Check production services
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps


      # ==========================================
      # HEALTH CHECK
      # ==========================================

      - name: Health check
        run: |
          curl -f http://localhost

