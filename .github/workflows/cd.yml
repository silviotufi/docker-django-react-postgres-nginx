name: CD

on:
  workflow_run:
    workflows:
      - Docker Registry
    types:
      - completed

jobs:

  deploy:
    name: Deploy to Production

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, cd]

    steps:

      # ==========================================
      # CHECK DOCKER
      # ==========================================

      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # ==========================================
      # GET VERSION
      # ==========================================

      - name: Set image version
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

          echo "Deploying version:"
          echo "${{ github.event.workflow_run.head_sha }}"


      # ==========================================
      # SAVE CURRENT VERSION
      # ==========================================

      - name: Save current version
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          if [ -f .env.prod ]; then
            PREVIOUS_TAG=$(grep '^IMAGE_TAG=' .env.prod | cut -d= -f2-)
          else
            PREVIOUS_TAG=""
          fi

          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

          echo "Previous version:"
          echo "$PREVIOUS_TAG"


      # ==========================================
      # CREATE PRODUCTION ENVIRONMENT
      # ==========================================

      - name: Create production secrets
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          cat > .env.prod <<EOF
          BACKEND_IMAGE=ghcr.io/silviotufi/docker-django-react-postgres-nginx-backend
          FRONTEND_IMAGE=ghcr.io/silviotufi/docker-django-react-postgres-nginx-frontend
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

          DEBUG=0
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1

          POSTGRES_DB=django_prod
          POSTGRES_USER=django
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=db-prod
          POSTGRES_PORT=5432
          EOF

          cat > .env.prod.db <<EOF
          POSTGRES_DB=django_prod
          POSTGRES_USER=django
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF


      # ==========================================
      # DEPLOY PRODUCTION
      # ==========================================

      - name: Deploy production
        id: deploy
        continue-on-error: true
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            pull

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            up -d


      # ==========================================
      # CHECK SERVICES
      # ==========================================

      - name: Check production services
        id: check_services
        if: ${{ steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            ps


      # ==========================================
      # HEALTH CHECK
      # ==========================================

      - name: Health check
        id: health_check
        if: ${{ steps.deploy.outcome == 'success' && steps.check_services.outcome == 'success' }}
        continue-on-error: true
        run: |
          curl -f --max-time 10 http://localhost


      # ==========================================
      # AUTOMATIC ROLLBACK
      # ==========================================

      - name: Rollback production
        if: >
          ${{
            (steps.deploy.outcome == 'failure' ||
             steps.check_services.outcome == 'failure' ||
             steps.health_check.outcome == 'failure')
            && env.PREVIOUS_TAG != ''
          }}
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          echo "=========================================="
          echo "ROLLBACK"
          echo "=========================================="

          echo "Previous version:"
          echo "$PREVIOUS_TAG"

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env.prod

          # IMPORTANT:
          # GITHUB_ENV contains the new version.
          # Override it so Docker Compose uses the previous version.
          export IMAGE_TAG="$PREVIOUS_TAG"

          echo "IMAGE_TAG used for rollback:"
          echo "$IMAGE_TAG"

          echo "Restoring previous Docker images..."

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            pull

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            up -d --force-recreate


      # ==========================================
      # VERIFY ROLLBACK
      # ==========================================

      - name: Verify rollback
        if: >
          ${{
            (steps.deploy.outcome == 'failure' ||
             steps.check_services.outcome == 'failure' ||
             steps.health_check.outcome == 'failure')
            && env.PREVIOUS_TAG != ''
          }}
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          # IMPORTANT:
          # Make Compose use the previous version during verification.
          export IMAGE_TAG="$PREVIOUS_TAG"

          echo "IMAGE_TAG used for verification:"
          echo "$IMAGE_TAG"

          echo "Waiting for services..."
          sleep 10

          echo "Checking production services..."

          docker compose \
            --env-file .env.prod \
            -f compose.prod.yaml \
            ps

          echo "Checking application..."

          curl -f --max-time 10 http://localhost

          echo "Rollback completed successfully."


      # ==========================================
      # FAIL RELEASE IF DEPLOYMENT FAILED
      # ==========================================

      - name: Mark deployment as failed
        if: >
          ${{
            steps.deploy.outcome == 'failure' ||
            steps.check_services.outcome == 'failure' ||
            steps.health_check.outcome == 'failure'
          }}
        run: |
          echo "The new deployment failed."
          echo "Production was restored to the previous version."
          exit 1