name: CD

on:
  workflow_run:
    workflows:
      - Docker Registry
    types:
      - completed

jobs:

  deploy:
    name: Deploy to Production

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, cd]

    steps:

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Deploy production
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            pull

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d

      - name: Check production services
        run: |
          cd ~/dockerlabs/prueba5/dodjrepostnginxmain

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps

      - name: Health check
        run: |
          curl -f http://localhost