name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Run Django checks
        run: docker run --rm backend-ci python manage.py check

      - name: Run backend tests
        run: docker run --rm backend-ci python manage.py test


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

      - name: Run frontend tests
        run: docker run --rm frontend-ci npm test -- --watchAll=false

      - name: Build frontend application
        run: docker run --rm frontend-ci npm run build


  integration:
    name: Integration CI
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI database secret
        run: |
          mkdir -p secrets
          echo "ci_password" > secrets/db_password.txt

      - name: Build and start services
        run: |
          docker compose -f compose.dev.yaml up -d --build

      - name: Check services
        run: |
          docker compose -f compose.dev.yaml ps

      - name: Run Django system check
        run: |
          docker compose -f compose.dev.yaml exec -T backend \
            python manage.py check

      - name: Check database migrations
        run: |
          docker compose -f compose.dev.yaml exec -T backend \
            python manage.py migrate --check

      - name: Check PostgreSQL
        run: |
          docker compose -f compose.dev.yaml exec -T postgres \
            sh -c 'PGPASSWORD=$(cat /run/secrets/db_password) psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT version();"'

      - name: Stop services
        if: always()
        run: |
          docker compose -f compose.dev.yaml down -v