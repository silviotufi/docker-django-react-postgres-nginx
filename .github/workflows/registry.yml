name: Docker Registry

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish Production Docker Images
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # LOGIN TO GHCR
      # ==========================================

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # BACKEND
      # ==========================================

      - name: Build backend production image
        run: |
          docker build \
            -f ./backend/Dockerfile.prod \
            -t ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}-backend:latest \
            ./backend

      - name: Push backend version
        run: |
          docker push \
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Push backend latest
        run: |
          docker push \
            ghcr.io/${{ github.repository }}-backend:latest


      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Build frontend production image
        run: |
          docker build \
            -f ./frontend/Dockerfile.prod \
            -t ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}-frontend:latest \
            ./frontend

      - name: Push frontend version
        run: |
          docker push \
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}

      - name: Push frontend latest
        run: |
          docker push \
            ghcr.io/${{ github.repository }}-frontend:latest