services:

  # ==========================================
  # BACKEND
  # ==========================================

  backend-prod:
    image: ghcr.io/silviotufi/docker-django-react-postgres-nginx-backend:${IMAGE_TAG}

    container_name: backend-app-prod

    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - static_volume:/home/app/web/api/static

    networks:
      - prod

    expose:
      - "8000"

    env_file:
      - ./.env.prod

    depends_on:
      db-prod:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================
  # FRONTEND
  # ==========================================

  frontend-prod:
    image: ghcr.io/silviotufi/docker-django-react-postgres-nginx-frontend:${IMAGE_TAG}

    container_name: frontend

    volumes:
      - static_volume:/home/app/web/api/static

    networks:
      - prod

    ports:
      - "8080:80"   #error controlado "80:80"

    environment:
      NODE_ENV: production

    depends_on:
      backend-prod:
        condition: service_started

    restart: unless-stopped


  # ==========================================
  # DATABASE
  # ==========================================

  db-prod:
    image: postgres:13.2-alpine

    container_name: db-prod

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

    networks:
      - prod

    env_file:
      - ./.env.prod.db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


# ==========================================
# VOLUMES
# ==========================================

volumes:

  postgres_data_prod:

  static_volume:


# ==========================================
# NETWORK
# ==========================================

networks:

  prod: