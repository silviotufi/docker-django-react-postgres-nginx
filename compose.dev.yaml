services:

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend-dev-v2

    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

    user: "0:0"

    environment:
      NODE_ENV: development

    command: >
      sh -c "chown -R $(stat -c '%u:%g' /app) /app/node_modules &&
             npm start"

    ports:
      - "3002:3000"

    stdin_open: true
    tty: true

    networks:
      - frontend_net


  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend-dev-v2

    volumes:
      - ./backend:/app

    environment:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DATABASE: ${POSTGRES_DB}
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD_FILE: /run/secrets/db_password
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE: postgres
      DJANGO_SETTINGS_MODULE: app.settings.local

      OTEL_SERVICE_NAME: django-backend
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOG_LEVEL: debug

    secrets:
      - db_password

    command: ["opentelemetry-instrument", "python", "manage.py", "runserver", "0.0.0.0:8000"]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net
      - observabilidad_default

    ports:
      - "4000:8000"


  postgres:

    image: postgres:13.2-alpine

    container_name: postgres-dev-v2

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  postgres_data_dev:
  node_modules:


networks:

  frontend_net:

  backend_net:

  observabilidad_default:
    external: true


secrets:

  db_password:
    file: ./secrets/db_password.txt